<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Donde está mi micro</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>

    <a href="#main-section" class="skip-link">Saltar al contenido principal</a>

    <header role="banner">
      <div class="header-inner">
        <div class="header-text">
          <h1 id="page-title">Dónde está mi micro</h1>
          <p class="header-subtitle">Transporte accesible para todos</p>
        </div>
      </div>
    </header>

    <main id="main-section" aria-labelledby="page-title">

      <!-- Sidebar -->
      <div class="container">

        <button id="volver" value="main" style="display: none" type="button" aria-label="Volver al menú principal">
          <span aria-hidden="true">←</span>
          Menú principal
        </button>

        <nav aria-label="Menú principal">
          <div class="buttons" id="main">
            <button id="paradas-fav" value="parada" type="button" aria-controls="parada" class="menu-btn">
              <span class="btn-icon" aria-hidden="true">⭐</span>
              <span class="btn-label">Paradas favoritas</span>
            </button>
            <button id="paradas-cercanas" value="parada" type="button" aria-controls="parada" class="menu-btn">
              <span class="btn-icon" aria-hidden="true">📍</span>
              <span class="btn-label">Paradas cercanas</span>
            </button>
            <button id="lineas" value="linea" type="button" aria-controls="linea" class="menu-btn">
              <span class="btn-icon" aria-hidden="true">🗺️</span>
              <span class="btn-label">Líneas</span>
            </button>
            <button id="recorridos" value="map" type="button" class="menu-btn">
              <span class="btn-icon" aria-hidden="true">🛣️</span>
              <span class="btn-label">Recorridos</span>
            </button>
          </div>
        </nav>

        <div class="buttons" id="linea" style="display: none" aria-label="Opciones de líneas">
          <button type="button" class="menu-btn"><span class="btn-label">Línea 1</span></button>
          <button type="button" class="menu-btn"><span class="btn-label">Línea 2</span></button>
          <button type="button" class="menu-btn"><span class="btn-label">Línea 3</span></button>
        </div>

        <div class="buttons" id="parada" style="display: none" aria-label="Opciones de paradas">
          <button type="button" class="menu-btn"><span class="btn-label">Parada 1</span></button>
          <button type="button" class="menu-btn"><span class="btn-label">Parada 2</span></button>
          <button type="button" class="menu-btn"><span class="btn-label">Parada 3</span></button>
          <button type="button" class="menu-btn"><span class="btn-label">Parada 4</span></button>
        </div>

        <section class="stop" aria-labelledby="stops-heading">
          <h2 id="stops-heading">Paradas cercanas</h2>
          <div id="stops-info" role="list" aria-live="polite" aria-atomic="false"></div>
        </section>

      </div>

      <!-- Mapa -->
      <div id="map" aria-label="Mapa interactivo de las paradas" role="application"></div>

    </main>

    <footer role="contentinfo">
      <p>Creado para Hackaton 2026 · Accesible para todos</p>
    </footer>

    <script src="/js/main.js" type="module"></script>
  </body>
</html>
