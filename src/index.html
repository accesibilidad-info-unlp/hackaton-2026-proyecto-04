<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Donde está mi micro</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <a href="#main-section" class="skip-link">Saltar al contenido principal</a>
    <header role="banner">
      <div class="header-inner">
        <div class="header-icon" aria-hidden="true">
          <!-- bus icon -->
          <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 18.75a1.5 1.5 0 0 1-3 0m3 0a1.5 1.5 0 0 0-3 0m3 0h6m-9 0H3.375a1.125 1.125 0 0 1-1.125-1.125V14.25m17.25 4.5a1.5 1.5 0 0 1-3 0m3 0a1.5 1.5 0 0 0-3 0m3 0h1.125c.621 0 1.129-.504 1.09-1.124a17.902 17.902 0 0 0-3.213-9.193 2.056 2.056 0 0 0-1.58-.86H14.25M16.5 18.75h-2.25m0-11.177v-.958c0-.568-.422-1.048-.987-1.106a48.554 48.554 0 0 0-10.026 0 1.106 1.106 0 0 0-.987 1.106v7.635m12-6.677v6.677m0 4.5v-4.5m0 0h-12" />
          </svg>
        </div>
        <div class="header-text">
          <h1 id="page-title">Dónde está mi micro</h1>
          <p class="header-subtitle">Transporte accesible para todos</p>
        </div>
      </div>
    </header>
    <main id="main-section" aria-labelledby="page-title">
      <!-- Sidebar -->
      <div class="container">
        <button id="volver" value="main" style="display: none" type="button" aria-label="Volver al menú principal">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5 3 12m0 0 7.5-7.5M3 12h18" />
          </svg>
          Menú principal
        </button>
        <nav aria-label="Menú principal">
          <div class="buttons" id="main">
            <button id="paradas-fav" value="parada" type="button" aria-controls="parada" class="menu-btn">
              <span class="btn-icon" aria-hidden="true">
                <!-- star -->
                <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M11.48 3.499a.562.562 0 0 1 1.04 0l2.125 5.111a.563.563 0 0 0 .475.345l5.518.442c.499.04.701.663.321.988l-4.204 3.602a.563.563 0 0 0-.182.557l1.285 5.385a.562.562 0 0 1-.84.61l-4.725-2.885a.562.562 0 0 0-.586 0L6.982 20.54a.562.562 0 0 1-.84-.61l1.285-5.386a.562.562 0 0 0-.182-.557l-4.204-3.602a.562.562 0 0 1 .321-.988l5.518-.442a.563.563 0 0 0 .475-.345L11.48 3.5Z" />
                </svg>
              </span>
              <span class="btn-label">Paradas favoritas</span>
            </button>
            <button id="paradas-cercanas" value="parada" type="button" aria-controls="parada" class="menu-btn">
              <span class="btn-icon" aria-hidden="true">
                <!-- map pin -->
                <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M15 10.5a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
                  <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 10.5c0 7.142-7.5 11.25-7.5 11.25S4.5 17.642 4.5 10.5a7.5 7.5 0 1 1 15 0Z" />
                </svg>
              </span>
              <span class="btn-label">Paradas cercanas</span>
            </button>
            <button id="lineas" value="linea" type="button" aria-controls="linea" class="menu-btn">
              <span class="btn-icon" aria-hidden="true">
                <!-- list bullet -->
                <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 6.75h12M8.25 12h12m-12 5.25h12M3.75 6.75h.007v.008H3.75V6.75Zm.375 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0ZM3.75 12h.007v.008H3.75V12Zm.375 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Zm-.375 5.25h.007v.008H3.75v-.008Zm.375 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Z" />
                </svg>
              </span>
              <span class="btn-label">Líneas</span>
            </button>
            <button id="recorridos" value="map" type="button" class="menu-btn">
              <span class="btn-icon" aria-hidden="true">
                <!-- map -->
                <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M9 6.75V15m6-6v8.25m.503 3.498 4.875-2.437c.381-.19.622-.58.622-1.006V4.82c0-.836-.88-1.38-1.628-1.006l-3.869 1.934c-.317.159-.69.159-1.006 0L9.503 3.252a1.125 1.125 0 0 0-1.006 0L3.622 5.689C3.24 5.88 3 6.27 3 6.695V19.18c0 .836.88 1.38 1.628 1.006l3.869-1.934c.317-.159.69-.159 1.006 0l4.994 2.497c.317.158.69.158 1.006 0Z" />
                </svg>
              </span>
              <span class="btn-label">Recorridos</span>
            </button>
          </div>
        </nav>
        <input id="buscador" type="text" name="" value="" placeholder="Buscar">
        <section class="stop" aria-labelledby="stops-heading">
          <h2 id="stops-heading">Paradas cercanas</h2>
          <div id="stops-info" role="list" aria-live="polite" aria-atomic="false"></div>
        </section>
      </div>
      <!-- Mapa -->
      <div id="map" aria-label="Mapa interactivo de las paradas" role="application"></div>
    </main>
    <footer role="contentinfo">
      <p>Creado para Hackaton 2026 · Accesible para todos</p>
    </footer>
    <script src="/js/main.js" type="module"></script>
  </body>
</html>
