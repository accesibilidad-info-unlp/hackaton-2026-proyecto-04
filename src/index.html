<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Donde está mi micro</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!--<a href="#main-section" class="skip-link">Saltar al contenido principal</a>-->
    <header role="banner">
      <div class="header-inner">
        <span class="material-symbols-outlined header-icon" aria-hidden="true">directions_bus</span>
        <div class="header-text">
          <h1 id="page-title">Dónde está mi micro</h1>
          <p class="header-subtitle">Transporte accesible para todos</p>
        </div>
      </div>
    </header>
    <main id="main-section" aria-labelledby="page-title">
      <!-- Sidebar -->
      <div class="container">
        <button
          id="volver"
          value="main"
          style="display: none"
          type="button"
          aria-label="Volver al menú principal"
          class="back-button"
        >
          <span class="material-symbols-outlined back-icon" aria-hidden="true">arrow_back</span>
          Menú principal
        </button>
        <nav aria-label="Menú principal">
          <div class="buttons" id="main">
            <button
              id="paradas-fav"
              value="parada"
              type="button"
              aria-controls="parada"
              aria-label="Ir a paradas favoritas"
              class="menu-btn"
            >
              <span class="material-symbols-outlined btn-icon favorite-icon" aria-hidden="true">star</span>
              <span class="btn-label">Paradas favoritas</span>
            </button>
            <button
              id="paradas-cercanas"
              value="parada"
              type="button"
              aria-controls="parada"
              aria-label="Ir a paradas cercanas por ubicación"
              class="menu-btn"
            >
              <span class="material-symbols-outlined btn-icon nearby-icon" aria-hidden="true">location_on</span>
              <span class="btn-label">Paradas cercanas</span>
            </button>
            <button
              id="lineas"
              value="linea"
              type="button"
              aria-controls="linea"
              aria-label="Ver todas las líneas de transporte"
              class="menu-btn"
            >
              <span class="material-symbols-outlined btn-icon lines-icon" aria-hidden="true">format_list_bulleted</span>
              <span class="btn-label">Líneas</span>
            </button>
            <button
              id="recorridos"
              value="map"
              type="button"
              aria-label="Ver mapa de recorridos de líneas"
              class="menu-btn"
            >
              <span class="material-symbols-outlined btn-icon map-icon" aria-hidden="true">map</span>
              <span class="btn-label">Recorridos</span>
            </button>
          </div>
        </nav>
        <div class="search-container">
          <label for="buscador" class="hidden">Buscar paradas o líneas:</label>
          <span class="material-symbols-outlined search-icon" aria-hidden="true">search</span>
          <input
            id="buscador"
            type="text"
            name="busqueda"
            value=""
            placeholder="Buscar paradas o líneas"
            aria-label="Campo de búsqueda de paradas o líneas"
            aria-describedby="buscador-help"
          />
          <span id="buscador-help" class="hidden"
            >Ingresa el nombre de una parada o línea para filtrar
            resultados</span
          >
        </div>
        <section class="stop" aria-labelledby="stops-heading">
          <h2 id="stops-heading">Paradas cercanas</h2>
          <div
            id="stops-info"
            role="list"
            aria-live="polite"
            aria-atomic="false"
            aria-label="Lista de paradas disponibles con información de líneas"
          ></div>
        </section>
      </div>
      <!-- Mapa -->
      <div
        id="map"
        aria-label="Mapa interactivo de las paradas"
        role="application"
      ></div>
    </main>
    <footer role="contentinfo">
      <p>Creado para Hackaton 2026 · Accesible para todos</p>
    </footer>
    <script src="/js/main.js" type="module"></script>
  </body>
</html>
